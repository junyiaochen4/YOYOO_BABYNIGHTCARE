<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幼幼眠｜我的樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="yym.css">
<style>
body{margin:0}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div id="top" class="yym-root">
<div class="yym-curtain" aria-hidden="true"><div class="yym-drop"><div class="yym-panel yym-l"></div><div class="yym-panel yym-r"></div><div class="yym-valance"></div></div></div>
<div class="yym-spot" aria-hidden="true"></div>
<input type="checkbox" id="yym-menu" class="yym-menu-chk" aria-label="開啟選單">
<header class="yym-head"><div class="yym-head-in">
<a href="index.html" class="yym-logo" aria-label="回到幼幼眠首頁"><img src="assets/logo-white.png" alt="幼幼眠 專業夜間幼兒照護機構"></a>
<div style="display: flex; align-items: center; gap: 14px">
<nav aria-label="主選單" class="yym-nav"><a href="index.html">開園序曲</a><a href="World.html">探索夢樂園</a><a href="Space.html">樂園地圖</a><a href="Team.html">樂園守夢人</a><a href="Night.html">一夜遊園記</a><a href="Flow.html">安心守護站</a><a href="Contact.html">樂園服務台</a><a href="Talk.html">親子彩排室</a><a href="Member.html" class="on">我的樂園</a><a href="Booking.html" class="yym-marquee">領取入園券</a></nav>
<label for="yym-menu" class="yym-burger" aria-label="開啟選單"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></label>
</div></div><div class="yym-canopy" aria-hidden="true"></div></header>
<label for="yym-menu" class="yym-scrim" aria-label="關閉選單"></label>
<nav aria-label="樂園選單" class="yym-drawer"><label for="yym-menu" class="yym-drawer-close" aria-label="關閉選單">×</label><a href="index.html">開園序曲<small>理念</small></a><a href="World.html">探索夢樂園<small>世界觀</small></a><a href="Space.html">樂園地圖<small>場所</small></a><a href="Team.html">樂園守夢人<small>托育員</small></a><a href="Night.html">一夜遊園記<small>一夜流程</small></a><a href="Flow.html">安心守護站<small>接送與應變</small></a><a href="Contact.html">樂園服務台<small>聯絡資訊</small></a><a href="Talk.html">親子彩排室<small>親子溝通</small></a><a href="Member.html" class="on">我的樂園<small>會員專區</small></a><a href="Booking.html" class="yym-marquee">領取入園券</a></nav>

<sc-if value="{{ showLogin }}" hint-placeholder-val="{{ true }}">
<section class="yym-wrap" style="padding-top: 88px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 340px; min-width: 0">
<p class="yym-label">MEMBER</p>
<h1 class="yym-h1">我的樂園</h1>
<p class="yym-muted" style="margin: 0 0 24px; font-size: 17px">查看今晚動態、聯繫值班托育員、管理預約與睡眠小檔案。每次登入都需手機簡訊驗證。</p>
<img src="assets/koala1.png" alt="" style="width: 150px; height: auto">
</div>
<div class="yym-card" style="flex: 1 1 380px; min-width: 0; padding: 32px">
<ol aria-label="登入步驟" style="list-style: none; margin: 0 0 20px; padding: 0; display: flex; gap: 8px; font-size: 14px; font-weight: 700">
<li style="flex: 1 1 0; padding-top: 8px; border-top: 4px solid #81C7E8; color: #81C7E8">1 手機號碼</li>
<li style="flex: 1 1 0; padding-top: 8px; border-top: 4px solid {{ step2Bar }}; color: {{ step2Text }}">2 簡訊驗證</li>
</ol>
<sc-if value="{{ isPhone }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<label class="yym-fl">手機號碼<input type="tel" inputmode="numeric" class="yym-inp" value="{{ phone }}" onChange="{{ setPhone }}" placeholder="09XX-XXX-XXX" style="font-size: 18px"></label>
<sc-if value="{{ phoneError }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; color: #F4A7A0; font-size: 14px">請輸入 10 碼手機號碼</p></sc-if>
<button type="button" onClick="{{ sendCode }}" class="yym-cloud pri" style="width: 100%">取得驗證碼</button>
<p class="yym-muted" style="margin: 0; font-size: 14px">還不是會員？<a href="Booking.html">先預約參觀</a>，參觀後由專人協助開通。</p>
</div>
</sc-if>
<sc-if value="{{ isCode }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<p class="yym-muted" style="margin: 0; font-size: 15px">驗證碼已傳送至 {{ phone }}</p>
<label class="yym-fl">6 位數驗證碼<input type="text" inputmode="numeric" maxlength="6" class="yym-inp" value="{{ code }}" onChange="{{ setCode }}" placeholder="______" style="font-size: 24px; letter-spacing: 10px"></label>
<sc-if value="{{ codeError }}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; color: #F4A7A0; font-size: 14px">驗證碼不正確，請再試一次</p></sc-if>
<span class="yym-tag" style="align-self: flex-start">展示用：輸入 123456</span>
<button type="button" onClick="{{ verify }}" class="yym-cloud pri" style="width: 100%">驗證並登入</button>
<button type="button" onClick="{{ back }}" style="background: none; border: none; font: inherit; color: #81C7E8; padding: 8px; min-height: 44px">更改手機號碼</button>
</div>
</sc-if>
</div>
</section>
</sc-if>

<sc-if value="{{ isDash }}" hint-placeholder-val="{{ false }}">
<section class="yym-wrap" style="padding-top: 48px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px">
<div style="display: flex; align-items: center; gap: 16px"><img src="assets/koala-happy.png" alt="" style="width: 64px; height: auto"><div><p class="yym-muted" style="margin: 0; font-size: 14px">歡迎回來，安安媽媽</p><h1 style="margin: 0; font-size: 26px; font-weight: 900">王安安（4 歲）・今晚已入托</h1></div></div>
<button type="button" onClick="{{ logout }}" class="yym-cloud">登出</button>
</div>
<div role="tablist" aria-label="會員功能" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{ t.selected }}" onClick="{{ t.pick }}" class="yym-cloud {{ t.cls }}">{{ t.label }}</button></sc-for>
</div>

<sc-if value="{{ tabStatus }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div class="yym-card" style="flex: 1.4 1 420px; min-width: 0">
<h2 style="margin: 0 0 16px; font-size: 19px">今晚動態</h2>
<ol style="list-style: none; margin: 0; padding: 0 0 0 20px; border-left: 3px solid #1863A1; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{ timeline }}" as="e" hint-placeholder-count="5"><li style="position: relative"><span style="position: absolute; left: -30px; top: 6px; width: 16px; height: 16px; border-radius: 50%; background: {{ e.dot }}"></span><span class="yym-muted" style="font-size: 13px">{{ e.time }}</span><br><strong>{{ e.text }}</strong></li></sc-for>
</ol>
</div>
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #1863A1; border-radius: 20px; padding: 22px"><p style="margin: 0; font-size: 13px; color: #C5DCEB">目前狀態</p><p style="margin: 0; font-size: 28px; font-weight: 900">安睡中</p><p style="margin: 0; font-size: 14px; color: #C5DCEB">21:12 入睡・夜醒 0 次</p></div>
<div class="yym-card" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div><p class="yym-muted" style="margin: 0; font-size: 13px">房內溫度</p><p style="margin: 0; font-size: 20px; font-weight: 900">25°C</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">濕度</p><p style="margin: 0; font-size: 20px; font-weight: 900">55%</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">主題房</p><p style="margin: 0; font-size: 20px; font-weight: 900">積木夢城</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">托育員</p><p style="margin: 0; font-size: 20px; font-weight: 900">林老師</p></div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ tabChat }}" hint-placeholder-val="{{ false }}">
<div class="yym-card" style="max-width: 760px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ messages }}" as="m" hint-placeholder-count="3"><p style="{{ m.style }}">{{ m.text }}</p></sc-for>
<div style="display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid #24303F; align-items: flex-end">
<label style="flex: 1 1 auto; min-width: 0"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">輸入訊息</span><input type="text" class="yym-inp" value="{{ draft }}" onChange="{{ setDraft }}" placeholder="輸入訊息給托育員…"></label>
<button type="button" onClick="{{ send }}" class="yym-cloud pri">送出</button>
</div>
</div>
</sc-if>

<sc-if value="{{ tabBooking }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 760px">
<div class="yym-card" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px"><div><p style="margin: 0; font-weight: 700">11/03（二）入托</p><p class="yym-muted" style="margin: 0; font-size: 14px">入托 17:00–17:30・離托 7:30–8:00・積木夢城</p></div><span class="yym-tag" style="color: #C9DD6B">已確認</span></div>
<div class="yym-card" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px"><div><p style="margin: 0; font-weight: 700">11/05（四）入托</p><p class="yym-muted" style="margin: 0; font-size: 14px">入托 17:30–18:00・離托 8:00–8:30</p></div><span class="yym-tag">候補中</span></div>
<a href="Booking.html" class="yym-marquee" style="align-self: flex-start">領取入園券</a>
</div>
</sc-if>

<sc-if value="{{ tabCare }}" hint-placeholder-val="{{ false }}">
<div class="yym-card" style="max-width: 760px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 28px; margin-bottom: 16px">
<div><p class="yym-muted" style="margin: 0; font-size: 13px">入睡時間</p><p style="margin: 0; font-weight: 700">21:00 左右</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">適合的方式</p><p style="margin: 0; font-weight: 700">聽故事、抱兔兔</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">害怕的事物</p><p style="margin: 0; font-weight: 700">全黑的房間</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">健康需求</p><p style="margin: 0; font-weight: 700">[家長填寫]</p></div>
</div>
<a href="SleepProfile.html" class="yym-cloud pri">編輯兒童睡眠小檔案</a>
</div>
</sc-if>
</section>
</sc-if>

<footer class="yym-foot"><div class="yym-foot-in"><p style="margin: 0">幼幼眠・專業夜間幼兒照護機構</p><p style="margin: 0">第四組 畢業專題概念網站・內容為設計提案</p></div></footer>
<a href="#top" class="yym-top" aria-label="回到頂部"><svg width="60" height="76" viewBox="0 0 60 76" aria-hidden="true"><rect x="29" y="0" width="2" height="10" fill="#81C7E8"></rect><path d="M14 24 A16 15 0 0 1 46 24 Z" fill="#1863A1"></path><rect x="14" y="23" width="32" height="5" fill="#1863A1"></rect><path d="M15 25.5 q2.5 2.2 5 0 t5 0 t5 0 t5 0 t5 0 t5 0" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path><path class="beam" d="M17 28 L43 28 L56 76 L4 76 Z" fill="#FFEC51"></path><text x="30" y="62" text-anchor="middle" font-size="11" font-weight="900" letter-spacing="1.5" fill="#0B0D12">TOP</text></svg></a>
</div>
</template>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="dc-mini.js"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { step: 'phone', phone: '', code: '', phoneError: false, codeError: false, tab: 'status', draft: '', messages: [
{ me: true, text: '安安下午有點咳嗽，麻煩多注意，謝謝！' },
{ me: false, text: '收到！入托體溫 36.8°C，睡前會再量一次。' },
{ me: false, text: '21:12 安安睡著了，咳嗽沒有加重。' }
] };
}
componentDidMount() { const h = document.querySelector('.yym-head'); if (h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); this._mv = (e) => { const r = document.documentElement; r.style.setProperty('--mx', e.clientX + 'px'); r.style.setProperty('--my', e.clientY + 'px'); }; window.addEventListener('mousemove', this._mv); }
componentWillUnmount() { window.removeEventListener('mousemove', this._mv); clearTimeout(this._t); }
renderVals() {
const s = this.state;
const me = 'margin: 0; align-self: flex-end; max-width: 78%; background: #1863A1; color: #FFFFFF; padding: 8px 14px; border-radius: 16px 16px 4px 16px; font-size: 15px';
const them = 'margin: 0; align-self: flex-start; max-width: 78%; background: #1D2735; color: #F2F4FA; padding: 8px 14px; border-radius: 16px 16px 16px 4px; font-size: 15px';
return {
showLogin: s.step !== 'dash', isPhone: s.step === 'phone', isCode: s.step === 'code', isDash: s.step === 'dash',
step2Bar: s.step === 'code' ? '#81C7E8' : '#25303D', step2Text: s.step === 'code' ? '#81C7E8' : '#7A8494',
phone: s.phone, code: s.code, phoneError: s.phoneError, codeError: s.codeError, draft: s.draft,
setPhone: (e) => this.setState({ phone: e.target.value, phoneError: false }),
setCode: (e) => this.setState({ code: e.target.value, codeError: false }),
sendCode: () => { if (s.phone.replace(/\D/g, '').length !== 10) { this.setState({ phoneError: true }); return; } this.setState({ step: 'code', code: '' }); },
verify: () => { if (s.code.trim() === '123456') this.setState({ step: 'dash', tab: 'status' }); else this.setState({ codeError: true }); },
back: () => this.setState({ step: 'phone' }),
logout: () => this.setState({ step: 'phone', code: '' }),
tabs: [['status', '今晚動態'], ['chat', '即時溝通'], ['booking', '我的預約'], ['care', '睡眠小檔案']].map(([id, label]) => ({ label, selected: s.tab === id ? 'true' : 'false', cls: s.tab === id ? 'is-on' : '', pick: () => this.setState({ tab: id }) })),
tabStatus: s.tab === 'status', tabChat: s.tab === 'chat', tabBooking: s.tab === 'booking', tabCare: s.tab === 'care',
timeline: [
{ time: '17:32', text: '已入托・體溫 36.8°C', dot: '#81C7E8' },
{ time: '18:10', text: '在「積木夢城」蓋了一座城', dot: '#81C7E8' },
{ time: '19:05', text: '晚餐吃完一碗飯＋青菜', dot: '#81C7E8' },
{ time: '20:20', text: '睡眠五步驟完成 4／5（跳過伸展）', dot: '#ED6D1F' },
{ time: '21:12', text: '已入睡', dot: '#FFEC51' }
],
messages: s.messages.map((m) => ({ text: m.text, style: m.me ? me : them })),
setDraft: (e) => this.setState({ draft: e.target.value }),
send: () => {
const t = s.draft.trim(); if (!t) return;
this.setState({ messages: s.messages.concat([{ me: true, text: t }]), draft: '' });
this._t = setTimeout(() => this.setState({ messages: this.state.messages.concat([{ me: false, text: '收到，我們會留意，有狀況會再通知您。' }]) }), 1200);
}
};
}
}
DCMini.mount(Component);
</script>
</body>
</html>
