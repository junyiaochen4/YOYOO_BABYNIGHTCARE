</div></div><div class="yym-canopy" aria-hidden="true"></div></header>

<nav aria-label="樂園選單" class="yym-drawer"><label for="yym-menu" class="yym-drawer-close" aria-label="關閉選單">×</label><a href="index.html">開園序曲<small>理念</small></a><a href="World.html">探索夢樂園<small>世界觀</small></a><a href="Space.html">樂園地圖<small>場所</small></a><a href="Team.html">樂園守夢人<small>托育員</small></a><a href="Night.html">一夜遊園記<small>一夜流程</small></a><a href="Flow.html">安心守護站<small>接送與應變</small></a><a href="Contact.html">樂園服務台<small>聯絡資訊</small></a><a href="Talk.html">親子彩排室<small>親子溝通</small></a><a href="Member.html" class="on">我的樂園<small>會員專區</small></a><a href="Booking.html" class="yym-marquee">領取入園券</a></nav>

<section class="yym-wrap" style="padding-top: 72px">
<p class="yym-muted" style="margin: 0 0 8px; font-size: 14px"><a href="Member.html">我的樂園</a> ／ 兒童睡眠小檔案</p>
<h1 class="yym-h1">兒童睡眠小檔案</h1>
<p class="yym-muted" style="margin: 0 0 32px; font-size: 17px; max-width: 640px">告訴我們孩子的睡眠習慣、安撫方式、害怕的事物、健康需求與安撫物。托育員會確認哪些方式適合、哪些應避免。</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 1.6 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<div class="yym-card" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px"><span style="color: #FFEC51">01</span>　基本資料</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<label class="yym-fl">孩子喜歡被怎麼稱呼<input type="text" class="yym-inp" value="{{ f.nick }}" onChange="{{ on.nick }}" placeholder="例如：安安"></label>
<label class="yym-fl">年齡<select class="yym-inp" value="{{ f.age }}" onChange="{{ on.age }}"><option value="">請選擇</option><option value="2 歲">2 歲</option><option value="3 歲">3 歲</option><option value="4 歲">4 歲</option><option value="5 歲">5 歲</option><option value="6 歲">6 歲</option></select></label>
</div>
</div>

<div class="yym-card" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px"><span style="color: #FFEC51">02</span>　睡眠習慣</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<label class="yym-fl">入睡時間<input type="time" class="yym-inp" value="{{ f.bed }}" onChange="{{ on.bed }}" style="color-scheme: dark"></label>
<label class="yym-fl">起床時間<input type="time" class="yym-inp" value="{{ f.wake }}" onChange="{{ on.wake }}" style="color-scheme: dark"></label>
<label class="yym-fl">夜間如廁<select class="yym-inp" value="{{ f.toilet }}" onChange="{{ on.toilet }}"><option value="">請選擇</option><option value="會自己起來">會自己起來</option><option value="需要提醒">需要提醒</option><option value="使用尿布">使用尿布</option></select></label>
</div>
<p id="g1" style="margin: 4px 0 0; font-weight: 700; font-size: 15px">入睡時的習慣（可複選）</p>
<div role="group" aria-labelledby="g1" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ sleepChips }}" as="c" hint-placeholder-count="7"><button type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" class="yym-cloud {{ c.cls }}" style="font-size: 15px">{{ c.label }}</button></sc-for></div>
</div>

<div class="yym-card" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px"><span style="color: #FFEC51">03</span>　安撫方式</h2>
<div role="group" aria-label="有用的安撫方式" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ sootheChips }}" as="c" hint-placeholder-count="6"><button type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" class="yym-cloud {{ c.cls }}" style="font-size: 15px">{{ c.label }}</button></sc-for></div>
<label class="yym-fl">孩子聽了會安心的話<input type="text" class="yym-inp" value="{{ f.sootheNote }}" onChange="{{ on.sootheNote }}" placeholder="例如：「媽媽吃完早餐就來」"></label>
<label class="yym-fl">應該避免的方式<input type="text" class="yym-inp" value="{{ f.avoid }}" onChange="{{ on.avoid }}" placeholder="例如：不喜歡被抱太緊"></label>
</div>

<div class="yym-card" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px"><span style="color: #FFEC51">04</span>　害怕的事物</h2>
<div role="group" aria-label="害怕的事物" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ fearChips }}" as="c" hint-placeholder-count="6"><button type="button" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" class="yym-cloud {{ c.cls }}" style="font-size: 15px">{{ c.label }}</button></sc-for></div>
<label class="yym-fl">其他補充<input type="text" class="yym-inp" value="{{ f.fearNote }}" onChange="{{ on.fearNote }}" placeholder="例如：怕吹風機的聲音"></label>
</div>

<div class="yym-card" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px"><span style="color: #FFEC51">05</span>　健康需求</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<label class="yym-fl">過敏<input type="text" class="yym-inp" value="{{ f.allergy }}" onChange="{{ on.allergy }}" placeholder="無則填「無」"></label>
<label class="yym-fl">皮膚狀況或慢性需求<input type="text" class="yym-inp" value="{{ f.skin }}" onChange="{{ on.skin }}"></label>
</div>
<label class="yym-fl">需要協助的用藥<input type="text" class="yym-inp" value="{{ f.med }}" onChange="{{ on.med }}"></label>
<p class="yym-muted" style="margin: 0; font-size: 13px">托育員不自行診斷、不任意給藥；用藥須另填用藥委託單。</p>
</div>

<div class="yym-card" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px"><span style="color: #FFEC51">06</span>　常用安撫物</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<label class="yym-fl">名稱<input type="text" class="yym-inp" value="{{ f.comfort }}" onChange="{{ on.comfort }}" placeholder="例如：小兔子「兔兔」"></label>
<label class="yym-fl">怎麼使用<input type="text" class="yym-inp" value="{{ f.comfortUse }}" onChange="{{ on.comfortUse }}" placeholder="例如：放在枕頭左邊"></label>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<button type="button" onClick="{{ save }}" class="yym-cloud pri" style="font-size: 17px; padding: 10px 32px">儲存小檔案</button>
<sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; color: #C9DD6B; font-weight: 700">已儲存，托育員會在入托前確認。</p></sc-if>
</div>
</div>

<aside aria-label="小檔案預覽" class="yym-card" style="flex: 1 1 300px; min-width: 0; border-top: 6px solid #81C7E8; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><img src="assets/koala-happy.png" alt="" style="width: 56px; height: auto"><div><p class="yym-muted" style="margin: 0; font-size: 13px">托育員看到的小檔案</p><p style="margin: 0; font-size: 20px; font-weight: 900">{{ title }}</p></div></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">作息</p><p style="margin: 0; font-weight: 700">{{ routine }}</p></div>
<div style="background: #1A1E10; border-radius: 12px; padding: 10px 14px"><p style="margin: 0; font-size: 13px; font-weight: 700; color: #C9DD6B">適合的方式</p><p style="margin: 0">{{ good }}</p></div>
<div style="background: #2E1A20; border-radius: 12px; padding: 10px 14px"><p style="margin: 0; font-size: 13px; font-weight: 700; color: #F5A27C">應避免・害怕</p><p style="margin: 0">{{ bad }}</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">健康需求</p><p style="margin: 0; font-weight: 700">{{ health }}</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">安撫物</p><p style="margin: 0; font-weight: 700">{{ comfortText }}</p></div>
</aside>
</div>
</section>

<footer class="yym-foot"><div class="yym-foot-in"><p style="margin: 0">幼幼眠・專業夜間幼兒照護機構</p><p style="margin: 0">第四組 畢業專題概念網站・內容為設計提案</p></div></footer>
<a href="#top" class="yym-top" aria-label="回到頂部"><svg width="60" height="76" viewBox="0 0 60 76" aria-hidden="true"><rect x="29" y="0" width="2" height="10" fill="#81C7E8"></rect><path d="M14 24 A16 15 0 0 1 46 24 Z" fill="#1863A1"></path><rect x="14" y="23" width="32" height="5" fill="#1863A1"></rect><path d="M15 25.5 q2.5 2.2 5 0 t5 0 t5 0 t5 0 t5 0 t5 0" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path><path class="beam" d="M17 28 L43 28 L56 76 L4 76 Z" fill="#FFEC51"></path><text x="30" y="62" text-anchor="middle" font-size="11" font-weight="900" letter-spacing="1.5" fill="#0B0D12">TOP</text></svg></a>
</div>
</template>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="dc-mini.js"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { saved: false, picks: { sleep: [], soothe: [], fear: [] },
f: { nick: '', age: '', bed: '', wake: '', toilet: '', sootheNote: '', avoid: '', fearNote: '', allergy: '', skin: '', med: '', comfort: '', comfortUse: '' } };
}
componentDidMount() { const h = document.querySelector('.yym-head'); if (h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); this._mv = (e) => { const r = document.documentElement; r.style.setProperty('--mx', e.clientX + 'px'); r.style.setProperty('--my', e.clientY + 'px'); }; window.addEventListener('mousemove', this._mv); }
componentWillUnmount() { window.removeEventListener('mousemove', this._mv); }
renderVals() {
const s = this.state, f = s.f;
const on = {};
Object.keys(f).forEach((k) => { on[k] = (e) => this.setState({ f: Object.assign({}, this.state.f, { [k]: e.target.value }), saved: false }); });
const chips = (g, labels) => labels.map((label) => {
const sel = s.picks[g].indexOf(label) >= 0;
return { label, pressed: sel ? 'true' : 'false', cls: sel ? 'is-on' : '', pick: () => {
const cur = this.state.picks[g];
this.setState({ picks: Object.assign({}, this.state.picks, { [g]: sel ? cur.filter((x) => x !== label) : cur.concat([label]) }), saved: false });
} };
});
const join = (a) => a.filter(Boolean).join('、');
return {
f, on, saved: s.saved,
sleepChips: chips('sleep', ['聽故事', '拍拍背', '抱安撫物', '輕音樂', '開小夜燈', '大人陪在旁邊', '可以自己睡']),
sootheChips: chips('soothe', ['抱抱', '拍背', '唱歌', '輕聲說話', '給安撫物', '安靜陪伴']),
fearChips: chips('fear', ['全黑的房間', '大聲響', '一個人', '陌生人靠近', '打雷', '關門']),
title: (f.nick || '孩子') + (f.age ? '（' + f.age + '）' : ''),
routine: (f.bed || f.wake) ? (f.bed || '—') + ' 入睡・' + (f.wake || '—') + ' 起床' + (f.toilet ? '・' + f.toilet : '') : '尚未填寫',
good: join(s.picks.sleep.concat(s.picks.soothe, [f.sootheNote])) || '尚未填寫',
bad: join(s.picks.fear.concat([f.fearNote, f.avoid])) || '尚未填寫',
health: join([f.allergy && '過敏：' + f.allergy, f.skin, f.med && '用藥：' + f.med]) || '尚未填寫',
comfortText: f.comfort ? f.comfort + (f.comfortUse ? '（' + f.comfortUse + '）' : '') : '尚未填寫',
save: () => this.setState({ saved: true })
};
}
}
DCMini.mount(Component);
</script>
</body>
