<section>
<div class="yym-wrap" style="padding-top: 96px; padding-bottom: 32px">
<p class="yym-label">OUR CAREGIVERS</p>
<h1 class="yym-h1">樂園守夢人</h1>
<p class="yym-muted" style="margin: 0 0 28px; font-size: 18px; max-width: 680px">12 位專業托育員輪班守護。每晚 8 位上班，每間主題房 2 位，從陪玩、入睡到清晨交接，都由同一組人陪伴孩子。</p>
<div class="yym-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr))">
<div class="yym-card"><p style="margin: 0; font-size: 28px; font-weight: 900; color: #FFEC51">12 位</p><p class="yym-muted" style="margin: 0; font-size: 14px">合格托育員輪班</p></div>
<div class="yym-card"><p style="margin: 0; font-size: 28px; font-weight: 900; color: #81C7E8">1 : 2</p><p class="yym-muted" style="margin: 0; font-size: 14px">每晚照護比例</p></div>
<div class="yym-card"><p style="margin: 0; font-size: 28px; font-weight: 900; color: #C9DD6B">100%</p><p class="yym-muted" style="margin: 0; font-size: 14px">兒童 CPR 與急救訓練</p></div>
<div class="yym-card"><p style="margin: 0; font-size: 28px; font-weight: 900; color: #F5A27C">輪流休息</p><p class="yym-muted" style="margin: 0; font-size: 14px">夜班有專屬休息室</p></div>
</div>
</div>
</section>

<section>
<div class="yym-wrap" style="padding-top: 32px">
<h2 class="yym-h2">認識守夢人<span class="yym-tag" style="letter-spacing: 0">照片與資料為示範</span></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="12">
<article class="yym-card" style="display: flex; flex-direction: column; gap: 10px; padding: 20px">
<div style="display: flex; gap: 14px; align-items: center">
<svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="{{ p.name }} 示範照片" style="flex: 0 0 auto; border-radius: 50%">
<rect width="76" height="76" fill="{{ p.bg }}"></rect>
<path d="M22 0 L54 0 L76 76 L0 76 Z" fill="#FFFFFF" opacity="0.10"></path>
<path d="M12 76 C12 56 24 50 38 50 C52 50 64 56 64 76 Z" fill="{{ p.shirt }}"></path>
<circle cx="38" cy="33" r="14" fill="#FDE4E1"></circle>
<path d="{{ p.hair }}" fill="#1A2B40"></path>
<circle cx="33" cy="34" r="1.6" fill="#1A2B40"></circle><circle cx="43" cy="34" r="1.6" fill="#1A2B40"></circle>
<path d="M34 39 Q38 42 42 39" stroke="#1A2B40" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
</svg>
<div>
<h3 style="margin: 0; font-size: 19px">{{ p.name }}</h3>
<p style="margin: 0; font-size: 14px; font-weight: 700; color: {{ p.roleColor }}">{{ p.role }}</p>
<p class="yym-muted" style="margin: 0; font-size: 13px">{{ p.room }}・年資 {{ p.years }}</p>
</div>
</div>
<p class="yym-muted" style="margin: 0; font-size: 14px"><strong style="color: #F2F4FA">證照｜</strong>{{ p.certs }}</p>
<p class="yym-muted" style="margin: 0; font-size: 14px"><strong style="color: #F2F4FA">專長｜</strong>{{ p.skill }}</p>
<p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #0E131B; font-size: 14px; color: #C5DCEB">「{{ p.quote }}」</p>
</article>
</sc-for>
</div>
</div>
</section>

<section style="background: #0E131B">
<div class="yym-wrap">
<h2 class="yym-h2">守夢人怎麼被培養</h2>
<div class="yym-grid">
<div class="yym-card"><span class="yym-num">1</span><h3 style="margin: 10px 0 4px; font-size: 17px">資格認證</h3><p class="yym-muted" style="margin: 0; font-size: 15px">保母技術士或教保員資格，結合平台雙向認證。</p></div>
<div class="yym-card"><span class="yym-num">2</span><h3 style="margin: 10px 0 4px; font-size: 17px">夜間照護培訓</h3><p class="yym-muted" style="margin: 0; font-size: 15px">睡眠五步驟、轉銜觀察與夜醒安撫的專門訓練。</p></div>
<div class="yym-card"><span class="yym-num">3</span><h3 style="margin: 10px 0 4px; font-size: 17px">急救與應變演練</h3><p class="yym-muted" style="margin: 0; font-size: 15px">兒童 CPR、火災地震疏散，定期複訓。</p></div>
<div class="yym-card"><span class="yym-num">4</span><h3 style="margin: 10px 0 4px; font-size: 17px">照顧照顧者</h3><p class="yym-muted" style="margin: 0; font-size: 15px">家事與托育分流、輪流休息，維持穩定的照護品質。</p></div>
</div>
</div>
</section>

<footer class="yym-foot"><div class="yym-foot-in"><p style="margin: 0">幼幼眠・專業夜間幼兒照護機構</p><p style="margin: 0">第四組 畢業專題概念網站・內容為設計提案</p></div></footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
class Component extends DCLogic {
componentDidMount() { const h = document.querySelector('.yym-head'); if (h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); this._mv = (e) => { const r = document.documentElement; r.style.setProperty('--mx', e.clientX + 'px'); r.style.setProperty('--my', e.clientY + 'px'); }; window.addEventListener('mousemove', this._mv); }
componentWillUnmount() { window.removeEventListener('mousemove', this._mv); }
renderVals() {
const hairs = [
'M24 32 C24 18 52 18 52 32 C48 24 28 24 24 32 Z',
'M23 36 C20 14 56 14 53 36 C52 26 46 22 38 22 C30 22 24 26 23 36 Z',
'M24 30 C26 17 50 17 52 30 L52 44 C50 34 50 28 38 26 C26 28 26 34 24 44 Z',
'M25 28 C28 19 48 19 51 28 C46 25 30 25 25 28 Z M44 18 C50 14 56 18 54 24 Z'
];
const bgs = ['#1863A1', '#2B2612', '#2E1A20', '#1A1E10'];
const shirts = ['#81C7E8', '#FFEC51', '#ED6D1F', '#ABC824'];
const rooms = ['積木夢城', '月光搖搖馬', '晚安小火車', '星光摩天輪'];
const data = [
['林曉晴', '托育主任', '全館督導', '15 年', '護理師、保母技術士', '兒童健康照護、夜間應變督導', '每個孩子的一夜，都值得被好好照顧。'],
['陳柏宇', '夜班組長', '積木夢城', '9 年', '幼兒園教保員、兒童 CPR', '排班協調、轉銜觀察', '我會記得每個孩子喜歡的入睡方式。'],
['王怡婷', '夜班組長', '月光搖搖馬', '8 年', '保母技術士、急救員', '夜醒安撫、家長溝通', '孩子安心，爸媽才能安心上班。'],
['張雅雯', '托育員', '晚安小火車', '6 年', '保母技術士、兒童 CPR', '共讀與語言陪伴', '睡前故事是我最喜歡的時間。'],
['李承翰', '托育員', '星光摩天輪', '5 年', '幼兒園教保員、兒童 CPR', '律動遊戲、情緒引導', '先玩夠，才睡得好。'],
['黃詩涵', '托育員', '積木夢城', '7 年', '保母技術士、兒童 CPR', '低齡幼兒照護', '慢慢來，等孩子準備好。'],
['吳佩珊', '托育員', '月光搖搖馬', '4 年', '幼兒園教保員、兒童 CPR', '睡前伸展、感統活動', '一起深呼吸，身體就會放鬆。'],
['劉家豪', '托育員', '晚安小火車', '5 年', '保母技術士、急救員', '安全巡視、環境監測', '整晚我都在，放心睡吧。'],
['蔡欣妤', '托育員', '星光摩天輪', '3 年', '幼兒園教保員、兒童 CPR', '美勞手作、主題任務設計', '每晚都想給孩子一個小驚喜。'],
['鄭宇彤', '托育員', '積木夢城', '6 年', '保母技術士、兒童 CPR', '過敏與飲食照護', '細節顧好，孩子就少一分不舒服。'],
['許文馨', '托育員', '月光搖搖馬', '4 年', '幼兒園教保員、兒童 CPR', '分離焦慮陪伴', '說好的再見，會讓明天更容易。'],
['周品妍', '托育員', '晚安小火車', '3 年', '保母技術士、兒童 CPR', '早晨喚醒與交接', '讓孩子笑著和爸媽回家。']
];
const people = data.map((d, i) => ({
name: d[0], role: d[1], room: d[2], years: d[3], certs: d[4], skill: d[5], quote: d[6],
hair: hairs[i % 4], bg: bgs[i % 4], shirt: shirts[i % 4],
roleColor: d[1] === '托育員' ? '#81C7E8' : '#FFEC51'
}));
return { people };
}
}
DCMini.mount(Component);
</script>
