<section>
<div class="yym-wrap" style="padding-top: 88px; padding-bottom: 40px">
<p class="yym-label">CONTACT</p>
<h1 class="yym-h1">樂園服務台</h1>
<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 24px">
<div class="yym-card" style="flex: 1 1 360px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="grid-column: 1 / -1"><p class="yym-muted" style="margin: 0; font-size: 13px">地址</p><p style="margin: 0; font-weight: 700">桃園市桃園區中路重劃區 [門牌待定]</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">電話</p><p style="margin: 0; font-weight: 700">[03-XXXX-XXXX]</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">LINE</p><p style="margin: 0; font-weight: 700">[@youyoumian]</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">Email</p><p style="margin: 0; font-weight: 700">[信箱待定]</p></div>
<div><p class="yym-muted" style="margin: 0; font-size: 13px">服務時段</p><p style="margin: 0; font-weight: 700">17:00–隔日 9:00</p></div>
<div style="grid-column: 1 / -1"><p class="yym-muted" style="margin: 0; font-size: 13px">參觀諮詢</p><p style="margin: 0; font-weight: 700">17:00–19:00・每組 1 小時</p></div>
</div>
<div style="flex: 1.2 1 400px; min-width: 0; min-height: 280px; border: 2px dashed #33414F; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #A9B3C2; text-align: center; padding: 24px; box-sizing: border-box">[地圖待補]<br>文中二路／慈文路／正光二街街廓</div>
</div>
</div>
</section>

<section>
<div class="yym-wrap" style="padding-top: 40px; padding-bottom: 40px; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1.2 1 460px; min-width: 0">
<h2 class="yym-h2">家長參觀流程</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<li style="display: flex; gap: 14px"><span class="yym-num">1</span><div><strong>預約參觀</strong><p class="yym-muted" style="margin: 0; font-size: 15px">確認時段、人數與最關心的問題。</p></div></li>
<li style="display: flex; gap: 14px"><span class="yym-num">2</span><div><strong>需求初談</strong><p class="yym-muted" style="margin: 0; font-size: 15px">工時、托育時段、孩子年齡、睡眠習慣與特殊需求。</p></div></li>
<li style="display: flex; gap: 14px"><span class="yym-num">3</span><div><strong>服務與環境介紹</strong><p class="yym-muted" style="margin: 0; font-size: 15px">照護方式、睡眠五步驟、人員分工、接送與安全機制。</p></div></li>
<li style="display: flex; gap: 14px"><span class="yym-num">4</span><div><strong>諮詢與可行性確認</strong><p class="yym-muted" style="margin: 0; font-size: 15px">收托條件、時段、收費與服務限制，不做無法保證的承諾。</p></div></li>
<li style="display: flex; gap: 14px"><span class="yym-num">5</span><div><strong>入托準備資料</strong><p class="yym-muted" style="margin: 0; font-size: 15px">新手托育禮包、<a href="SleepProfile.html">兒童睡眠小檔案</a>與入托文件。</p></div></li>
<li style="display: flex; gap: 14px"><span class="yym-num">6</span><div><strong>後續聯繫</strong><p class="yym-muted" style="margin: 0; font-size: 15px">評估後再進行正式申請與入托評估。</p></div></li>
</ol>
<a href="Booking.html" class="yym-marquee" style="margin-top: 24px">領取入園券</a>
</div>
<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div class="yym-card" style="border-top: 4px solid #FFEC51"><p style="margin: 0 0 8px; font-weight: 900; color: #FFEC51">參觀注意事項</p><ul class="yym-muted" style="margin: 0; padding-left: 20px; font-size: 15px; display: flex; flex-direction: column; gap: 4px"><li>避免干擾正在休息的兒童。</li><li>不公開其他兒童的姓名、影像、健康或家庭資料。</li><li>參觀不代表已取得收托資格。</li><li>孩子同行以短時間、低刺激、可退出為主，不強迫互動或試睡。</li></ul></div>
<div class="yym-card"><p style="margin: 0 0 8px; font-weight: 900">其他注意事項</p><ul class="yym-muted" style="margin: 0; padding-left: 20px; font-size: 15px; display: flex; flex-direction: column; gap: 4px"><li>參觀採預約制：17:00–19:00 每小時一個時段，同時段最多 2 組。</li><li>入托取消請於 [當日 12:00] 前通知。</li><li>入托前請完成兒童睡眠小檔案。</li></ul></div>
</div>
</div>
</section>

<section>
<div class="yym-wrap" style="padding-top: 40px; padding-bottom: 40px">
<h2 class="yym-h2">育兒小知識</h2>
<div class="yym-grid">
<div class="yym-card"><p style="margin: 0; font-size: 26px; font-weight: 900; color: #81C7E8">10–13 hrs</p><p class="yym-muted" style="margin: 0; font-size: 15px">3–5 歲每天需要的睡眠時數（含午睡）。</p></div>
<div class="yym-card"><p style="margin: 0; font-size: 26px; font-weight: 900; color: #FFEC51">越固定越好</p><p class="yym-muted" style="margin: 0; font-size: 15px">睡前儀式每晚同順序，孩子更快入睡。</p></div>
<div class="yym-card"><p style="margin: 0; font-size: 26px; font-weight: 900; color: #F5A27C">暗一點</p><p class="yym-muted" style="margin: 0; font-size: 15px">睡前一小時減少螢幕與強光。</p></div>
<div class="yym-card"><p style="margin: 0; font-size: 26px; font-weight: 900; color: #C9DD6B">一起讀</p><p class="yym-muted" style="margin: 0; font-size: 15px">睡前共讀助眠，也促進語言發展。</p></div>
</div>
</div>
</section>

<section>
<div class="yym-wrap" style="padding-top: 40px; padding-bottom: 40px">
<h2 class="yym-h2">常見問題</h2>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 860px">
<sc-for list="{{ faqs }}" as="f" hint-placeholder-count="6">
<div>
<button type="button" onClick="{{ f.toggle }}" aria-expanded="{{ f.expanded }}" class="yym-cloud wide {{ f.cls }}" style="width: 100%; flex-direction: row; justify-content: space-between; align-items: center; font-size: 17px"><span>{{ f.q }}</span><span aria-hidden="true" style="font-size: 22px">{{ f.sign }}</span></button>
<sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}"><p class="yym-muted" style="margin: 10px 26px 8px; font-size: 16px">{{ f.a }}</p></sc-if>
</div>
</sc-for>
</div>
</div>
</section>

<section style="background: #0E131B">
<div class="yym-wrap">
<h2 class="yym-h2">問答區</h2>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div class="yym-card" style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<label class="yym-fl">您的稱呼<input type="text" class="yym-inp" value="{{ name }}" onChange="{{ setName }}" placeholder="例如：安安媽媽"></label>
<label class="yym-fl">想問的問題<textarea rows="4" class="yym-inp" value="{{ draft }}" onChange="{{ setDraft }}" placeholder="照護團隊會在 1–2 個工作天內回覆。" style="resize: vertical"></textarea></label>
<button type="button" onClick="{{ submit }}" class="yym-cloud pri" style="align-self: flex-start">送出提問</button>
<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; color: #C9DD6B; font-weight: 700">已收到，回覆後會顯示在右側。</p></sc-if>
</div>
<div style="flex: 1.3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ questions }}" as="item" hint-placeholder-count="3">
<div class="yym-card" style="padding: 18px 22px">
<p class="yym-muted" style="margin: 0; font-size: 13px">{{ item.who }}・{{ item.date }}</p>
<p style="margin: 0 0 8px; font-weight: 700">Q：{{ item.q }}</p>
<sc-if value="{{ item.answered }}" hint-placeholder-val="{{ true }}"><p style="margin: 0; padding: 10px 14px; background: #12263A; color: #C5DCEB; border-radius: 12px; font-size: 15px">幼幼眠：{{ item.a }}</p></sc-if>
<sc-if value="{{ item.pending }}" hint-placeholder-val="{{ false }}"><span class="yym-tag">待回覆</span></sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</section>

<footer class="yym-foot"><div class="yym-foot-in"><p style="margin: 0">幼幼眠・專業夜間幼兒照護機構</p><p style="margin: 0">第四組 畢業專題概念網站・內容為設計提案</p></div></footer>
<a href="#top" class="yym-top" aria-label="回到頂部"><svg width="60" height="76" viewBox="0 0 60 76" aria-hidden="true"><rect x="29" y="0" width="2" height="10" fill="#81C7E8"></rect><path d="M14 24 A16 15 0 0 1 46 24 Z" fill="#1863A1"></path><rect x="14" y="23" width="32" height="5" fill="#1863A1"></rect><path d="M15 25.5 q2.5 2.2 5 0 t5 0 t5 0 t5 0 t5 0 t5 0" stroke="#FFFFFF" stroke-width="1.2" fill="none"></path><path class="beam" d="M17 28 L43 28 L56 76 L4 76 Z" fill="#FFEC51"></path><text x="30" y="62" text-anchor="middle" font-size="11" font-weight="900" letter-spacing="1.5" fill="#0B0D12">TOP</text></svg></a>
</div>
</template>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="dc-mini.js"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: 0, name: '', draft: '', sent: false, questions: [
{ who: '家長 A', date: '10/28', q: '孩子會認床，可以帶自己的小被子嗎？', a: '可以，交接時我們會一起放進孩子的主題房。' },
{ who: '家長 B', date: '10/30', q: '班表常變動，可以只預約當週嗎？', a: '可以，會員可依班表逐晚預約，名額即時顯示。' }
] };
}
componentDidMount() { const h = document.querySelector('.yym-head'); if (h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); this._mv = (e) => { const r = document.documentElement; r.style.setProperty('--mx', e.clientX + 'px'); r.style.setProperty('--my', e.clientY + 'px'); }; window.addEventListener('mousemove', this._mv); }
componentWillUnmount() { window.removeEventListener('mousemove', this._mv); }
renderVals() {
const data = [
{ q: '誰可以申請入托？', a: '2–6 歲幼兒，優先提供輪班、夜班、加班家庭；臨時喘息依當晚名額收托。' },
{ q: '費用怎麼算？有補助嗎？', a: '[收費方式待定]。我們會協助申請桃園市夜間托育相關補助，收費項目公開透明。' },
{ q: '孩子不想參加睡前儀式怎麼辦？', a: '每個儀式都可以跳過，照護員會陪孩子用自己的方式安頓下來。' },
{ q: '半夜醒來會有人在嗎？', a: '會。每間主題房 4 位孩子、2 位托育員，全館 8 位托育員輪值。' },
{ q: '晚上可以知道孩子的狀況嗎？', a: '登入會員專區即可查看即時動態，也能與值班照護員聯繫。' },
{ q: '有過敏或皮膚狀況可以入托嗎？', a: '可以，請在兒童睡眠小檔案詳細填寫，我們提供非醫療性的初步處理。' }
];
const faqs = data.map((f, i) => ({ ...f, open: this.state.open === i, expanded: this.state.open === i ? 'true' : 'false', sign: this.state.open === i ? '−' : '+', cls: this.state.open === i ? 'is-on' : '', toggle: () => this.setState({ open: this.state.open === i ? -1 : i }) }));
return {
faqs,
questions: this.state.questions.slice().reverse().map((x) => ({ ...x, answered: !!x.a, pending: !x.a })),
name: this.state.name, draft: this.state.draft, sent: this.state.sent,
setName: (e) => this.setState({ name: e.target.value }),
setDraft: (e) => this.setState({ draft: e.target.value, sent: false }),
submit: () => {
const q = this.state.draft.trim(); if (!q) return;
const d = new Date();
this.setState({ questions: this.state.questions.concat([{ who: this.state.name.trim() || '訪客', date: (d.getMonth() + 1) + '/' + d.getDate(), q, a: '' }]), draft: '', sent: true });
}
};
}
}
DCMini.mount(Component);
</script>
</body>
</html>
